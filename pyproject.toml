[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lowess-boosting"
version = "0.1.0"
description = "Multivariate LOWESS and LOWESS-based gradient boosting as scikit-learn estimators"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Siyuan David Zhu" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.6",
]
keywords = ["lowess", "loess", "local regression", "gradient boosting", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.6"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.6", "build>=1.0"]

[project.urls]
Source = "https://github.com/Siyuan-Zhu/lowess-boosting-from-scratch"

[tool.hatch.build.targets.wheel]
packages = ["src/lowess_boosting"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "benchmarks", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-ra --doctest-modules"

[tool.coverage.run]
source = ["lowess_boosting"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
